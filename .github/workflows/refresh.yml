name: refresh

# Пересобирает дашборд из таблицы. Раз в час и по кнопке.
# Если данные не менялись — коммита не будет.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Без секретов build.py собрал бы выдуманные данные и затёр настоящие.
      - name: Проверить, что секреты заданы
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          if [ -z "$SHEET_ID" ]; then
            echo "Секрет SHEET_ID не задан. Настройки → Secrets and variables → Actions."
            exit 1
          fi

      - name: Собрать страницу из таблицы
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python build.py

      - name: Проверить, что ключ не попал в страницу
        run: |
          if grep -q "AIza" index.html; then
            echo "В index.html найден ключ. Сборка остановлена."
            exit 1
          fi

      - name: Закоммитить, если данные изменились
        run: |
          if git diff --quiet -- index.html; then
            echo "Данные не менялись, коммит не нужен."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Обновление данных из таблицы"
          git push
